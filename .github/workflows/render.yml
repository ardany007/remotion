name: Render Video Remotion

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'ID Komposisi yang ingin dirender'
        required: true
        default: 'LossLeader'

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Voiceover Master
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            npm run vo:final
          else
            echo "Menggunakan audio bawaan"
          fi

      - name: Render Video
        run: |
          npx remotion render ${{ github.event.inputs.composition }} out/${{ github.event.inputs.composition }}.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.composition }}
          path: out/${{ github.event.inputs.composition }}.mp4
